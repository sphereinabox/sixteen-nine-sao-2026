; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
;include_dir = .

[env]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = genericCH32V003F4P6
framework = ch32v003fun
;monitor_speed = 115200
; default upload and debug protocol is "wch-link", using OpenOCD and
; expecting a WCH-LinkE programming adapter.
; To use minichlink (handles WCH-Link(E), USB ISP and some others), uncomment this
upload_protocol = minichlink
; can also use minichlink for SWD debugging. beware: step over not working
; correctly, only use "set breakpoint" and "continue".
;debug_tool = minichlink
; additionally uncomment this to use ardulink on a specific COM port
;upload_flags =

[fun_base]
extends = env
; shared code across examples are in sao-ch32-is31 folder:
build_src_filter = +<sao-ch32-is31>
;build_flags = -flto -Ich32fun -I/usr/include/newlib -lgcc -Iextralibs

[env:blink]
extends = fun_base
build_src_filter = ${fun_base.build_src_filter} +<examples/blink>

[env:button_test]
extends = fun_base
build_src_filter = ${fun_base.build_src_filter} +<examples/button_test>

[env:plamsa_float]
extends = fun_base
build_src_filter = ${fun_base.build_src_filter} +<examples/plamsa_float>

[env:text_scroll]
extends = fun_base
build_src_filter = ${fun_base.build_src_filter} +<examples/text_scroll>

[env:i2c_slave]
extends = fun_base
build_src_filter = ${fun_base.build_src_filter} +<examples/i2c_slave>

[env:sao_animations]
extends = fun_base
build_src_filter = ${fun_base.build_src_filter} +<examples/sao_animations>
